<script>
const API = "http://localhost:4010", $ = (s) => document.querySelector(s), NS = "http://www.w3.org/2000/svg";
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// all state lives in the backend (/world); the browser keeps nothing
try { for (const k of Object.keys(localStorage)) if (k.startsWith("bta.")) localStorage.removeItem(k); } catch {}
const wsave = (path, method, body) => api(path, method, body).catch(() => {});
const K = "#17110c", rnd = (i) => { const x = Math.sin(i * 91.7) * 10000; return x - Math.floor(x); }, trunc = (s, n) => (s || "").length > n ? s.slice(0, n - 1) + "…" : s || "";
let S = { me: { id: "nate", name: "Nathan" }, users: [], issues: [], prs: [], envs: [], wts: [], sessions: [], derived: [], sel: null, hand: null, bread: 0, work: {}, roster: { humans: {}, mechs: {} }, openAct: null, plots: {}, tab: "main", orders: [], doneToday: 0, releases: [], bills: [], haul: null, drops: [], pickups: [], reviews: [], images: [], seen: new Set(), dismissed: new Set() };
let sig = "", reg = {}, pawns = [], cam = { x: 40, y: 40, k: 0.8 };

async function api(path, method = "GET", body) {
  try {
    const r = await fetch(API + path, { method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText);
    $("#err").style.display = "none"; return j;
  } catch (e) { $("#err").textContent = e.message === "Failed to fetch" ? "Can't reach the backend at " + API + " — run: node backend/server.js" : e.message; $("#err").style.display = "block"; throw e; }
}

/* ---------------- derive: what needs a person ---------------- */
const TYPE = { review: "review", merge: "deploy", deploy: "deploy", pipe: "deploy", verify: "verify", dev: "build", start: "build", bp: "build", fix: "build", ready: "build", tidy: "chores", relbuild: "deploy", relrisk: "deploy", switch: "deploy" };
const TYPES = [["build", "Build"], ["review", "Review"], ["verify", "Verify"], ["deploy", "Deploy"], ["chores", "Chores"]];
const DEF = { human: { build: 2, review: 1, verify: 2, deploy: 1, chores: 3 }, mech: { build: 1, review: 2, verify: 3 } };
function derive() {
  const me = S.me.id, nm = (id) => S.users.find((u) => u.id === id)?.name ?? id, out = [], hasWt = new Set(S.wts.map((w) => w.issue).filter(Boolean));
  const add = (ref, pri, title, sub) => out.push({ ref, pri, title, sub, kind: ref.split(":")[0] });
  for (const p of S.prs) {
    const k = `${p.repo}#${p.id}`;
    if (p.state === "OPEN" && p.reviewers.includes(me)) add("review:" + k, 2, `Review ${k}: ${p.title}`, `from ${nm(p.author)}`);
    if (p.author === me && p.state === "APPROVED") add("merge:" + k, 1, `Merge ${k}: ${p.title}`, "approved — merge it");
    if (p.author === me && p.state === "CHANGES_REQUESTED") add("fix:" + k, 3, `Address review on ${k}`, p.title);
    if (p.author === me && p.state === "DRAFT") add("ready:" + k, 4, `Finish ${k} and mark ready`, p.title);
  }
  for (const i of S.issues.filter((x) => x.assignee === me && x.type !== "Feature")) {
    if (i.status === "Verification") add("verify:" + i.key, 3, `Verify ${i.key} on staging`, i.title);
    else if (["Dev WIP", "Dev Done"].includes(i.status) && !hasWt.has(i.key)) add("bp:" + i.key, 5, `Build a room for ${i.key}`, i.title);
    else if (i.status === "Dev WIP") add("dev:" + i.key, 5, `Work on ${i.key}`, i.title);
  }
  for (const e of S.envs) {
