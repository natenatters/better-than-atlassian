*{box-sizing:border-box;margin:0}

@keyframes pulse{0%{transform:scale(1);opacity:1}100%{transform:scale(1.9);opacity:0}}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bubble{margin:0 22px 16px;padding:12px 18px;background:#efe6cf;color:#2a2418;border-radius:14px;display:flex;gap:14px;align-items:center;box-shadow:0 3px 0 #a99a72}

.bubble button{margin-left:auto;background:#e8c872;border:2px solid #a99a72;border-radius:8px;padding:6px 14px;font:700 13px inherit;cursor:pointer;color:#2a2418}
